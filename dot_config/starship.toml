"$schema" = 'https://starship.rs/config-schema.json'

# Powerlevel10k Lean: place the right-side segments above the input line.
format = """
$os$directory$git_branch$git_commit$git_state$git_status\
$fill\
$cmd_duration$jobs$direnv$python$conda${custom.python_manager}${custom.node_env}$username$hostname\
$line_break$character"""
add_newline = true

[fill]
symbol = '·'
style = 'fg:170' # Starship theme purple!

[character]
success_symbol = '[❯](green)'
error_symbol = '[❯](red)'
vimcmd_symbol = '[❮](green)'
vimcmd_replace_one_symbol = '[▶](green)'
vimcmd_replace_symbol = '[▶](green)'
vimcmd_visual_symbol = '[V](green)'

[cmd_duration]
min_time = 3000
format = ' [󱎫 $duration](yellow)'

[jobs]
symbol = ''
format = ' [$symbol](red)'

[os]
disabled = false
format = '$symbol'

[username]
format = ' [$user]($style)'
style_user = 'white'
style_root = 'bold red'
show_always = false

[package]
symbol = "󰏗 "
disabled = true

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = ''
ahead = '[⇡${count}](green) '
diverged = '[⇡${ahead_count}⇣${behind_count}](green) '
behind = '[⇣${count}](green) '
stashed = '[*${count}](green) '
untracked = '[?${count}](blue) '
modified = '[!${count}](yellow) '
staged = '[+${count}](yellow) '
deleted = '[-${count}](red) '

