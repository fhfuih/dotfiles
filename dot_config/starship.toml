# Check the shell's selected versions. Project files alone don't trigger these segments.
[custom.python_manager]
os = 'unix'
shell = ['sh']
when = true
symbol = ' '
format = '( [$symbol$output](cyan))'
command = '''
[ -z "$VIRTUAL_ENV$CONDA_PREFIX" ] || exit 0
version=
if [ -n "$PYENV_VERSION$PYENV_SHELL" ]; then
    version=$(pyenv version-name 2>/dev/null) || exit 0
elif [ -n "$MISE_SHELL" ]; then
    version=$(mise current python 2>/dev/null) || exit 0
fi
case $version in
    ''|system) ;;
    *) printf '%s\n' "$version" ;;
esac
'''

[custom.node_env]
os = 'unix'
shell = ['sh']
when = true
symbol = ' '
format = '( [$symbol$output](green))'
command = '''
version=
if [ -n "$NODE_VIRTUAL_ENV" ]; then
    printf '%s\n' "${NODE_VIRTUAL_ENV##*/}"
    exit 0
fi
if [ -n "$FNM_MULTISHELL_PATH" ]; then
    version=$(fnm current 2>/dev/null)
    case $version in none|system) version= ;; esac
fi
if [ -z "$version" ] && [ -n "$NVM_BIN" ]; then
    nvm_version_dir=${NVM_BIN%/bin}
    version=${nvm_version_dir##*/}
fi
if [ -z "$version" ] && [ -n "$NODENV_VERSION$NODENV_SHELL" ]; then
    version=$(nodenv version-name 2>/dev/null)
    [ "$version" != system ] || version=
fi
if [ -z "$version" ] && [ -n "$MISE_SHELL" ]; then
    version=$(mise current node 2>/dev/null)
fi
case $version in
    ''|system) ;;
    *) printf '%s\n' "$version" ;;
esac
'''

